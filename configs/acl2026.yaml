# Configuration of the ACL 2026 experiments.
# Used by scripts/generate_dataset.py, train.py, merge_lora.py,
# evaluate_nli.py, evaluate_srl.py and evaluate_qa.py.
#
# Relative paths are resolved against the repository root.

framenet:
  version: "1.7"                       # NLTK package framenet_v17 / official fndata-1.7

# ---------------------------------------------------------------------------
# 1. Dataset generation (scripts/generate_dataset.py)
# ---------------------------------------------------------------------------
generation:
  frames: all                          # all 1,221 FrameNet 1.7 frames
  max_frames: null
  # The original corpus was generated without a fixed seed, so it cannot be
  # regenerated byte for byte. With this seed every frame is seeded with
  # "<seed>:<frame name>" and the output is deterministic.
  seed: 3407
  embedding_model: all-MiniLM-L6-v2    # sentence-transformers model for negative filtering
  negative_threshold: 0.50             # frame-level filter: keep negatives with sim < 0.50
  # Candidate-level thresholds (0.5 or 0.4, depending on the task) are fixed in
  # src/framellama/dataset_builder.py, exactly as in the original code.

  # The task-family numbers (T1-T40) are in src/framellama/task_families.py.

# ---------------------------------------------------------------------------
# 2. Fine-tuning (scripts/train.py, scripts/merge_lora.py)
#    Values are those of the original training script.
# ---------------------------------------------------------------------------
training:
  base_model: unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit   # 4-bit Llama-3.1-8B-Instruct (Unsloth)
  load_in_4bit: true
  max_seq_length: 2048
  seed: 3407

  # Training data, read directly from Hugging Face (downloaded once and cached):
  # https://huggingface.co/datasets/sag-uniroma2/FrameLLaMA-FullFN17-Instructions
  # Can also be an https://.../resolve/main/train.json URL or a local file.
  # No validation set is used.
  train_data: hf://datasets/sag-uniroma2/FrameLLaMA-FullFN17-Instructions/train.json
  question_field: Question
  answer_field: Answer
  instruction_field: Instruction

  output_dir: checkpoints/acl2026            # checkpoints (training resumes from the latest)
  adapter_dir: checkpoints/acl2026/final_adapter
  merged_dir: checkpoints/acl2026/merged_fp16

  lora:
    r: 8
    alpha: 16
    dropout: 0.1
    bias: none
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

  args:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 16          # effective batch size 32
    num_train_epochs: 10
    learning_rate: 5.0e-6
    warmup_steps: 300
    lr_scheduler_type: linear
    optim: adamw_8bit
    weight_decay: 0.01
    max_grad_norm: 1.0
    logging_steps: 500
    save_steps: 500
    # No validation: the final checkpoint is kept.
    # Precision: fp16 compute on the 4-bit base model.

# ---------------------------------------------------------------------------
# 3. Evaluation (scripts/evaluate_nli.py, evaluate_srl.py, evaluate_qa.py)
# ---------------------------------------------------------------------------
evaluation:
  models:
    adapted: sag-uniroma2/FrameLLaMA-3.1-8B-Instruct-FullFN17     # --adapted
    baseline: meta-llama/Llama-3.1-8B-Instruct                    # --baseline
    # other open models compared in the paper (run with --models <alias>;
    # gpt-oss needs --prompt-format gpt-oss)
    gpt-oss-20b: openai/gpt-oss-20b
    gemma-3-4b: google/gemma-3-4b-it
    deepseek-r1-qwen-7b: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
  run_models: [baseline, adapted]                 # used when no model is given
  output_dir: results/runs                   # new runs are written here

  vllm:
    gpu_memory_utilization: 0.80
    max_model_len: 8192
    dtype: auto

  nli:
    benchmarks:
      confer: evaluation/splits/nli/test_confer.json
      snli: evaluation/splits/nli/test_snli.json
    settings: [zero-shot, few-shot]

  srl:
    gold_file: evaluation/splits/srl/srl_gold_std.json
    tasks: [roles, lu, frame]
    vllm:
      gpu_memory_utilization: 0.90
      dtype: float16

  qa:
    # In-domain FrameNet QA: the diagnostic test split of the released dataset
    # (247.9k), one file per question type, read directly from Hugging Face.
    test_files:
      opened: hf://datasets/sag-uniroma2/FrameLLaMA-FullFN17-Instructions/test/Opened.json    # 59.4k open-ended
      closed: hf://datasets/sag-uniroma2/FrameLLaMA-FullFN17-Instructions/test/Closed.json    # 81.7k yes/no
      mcq: hf://datasets/sag-uniroma2/FrameLLaMA-FullFN17-Instructions/test/MCQ.json          # 106.8k multiple choice
    vllm:
      gpu_memory_utilization: 0.85
      max_model_len: 8192
      dtype: float16
